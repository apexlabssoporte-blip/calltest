services:
  - type: web
    name: calltest-api
    env: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EVIDENCE_STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true
      - key: CAMPAIGN_TARGET_TESTERS
        value: "12"
      - key: CAMPAIGN_MAX_TESTERS
        value: "15"
      - key: CAMPAIGN_DURATION_DAYS
        value: "14"
databases:
  - name: calltest-db
    plan: free
    databaseName: calltest_prod
    user: calltest
