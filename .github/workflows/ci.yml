name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calltest_user
          POSTGRES_PASSWORD: calltest_password
          POSTGRES_DB: calltest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calltest_user -d calltest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://calltest_user:calltest_password@localhost:5432/calltest_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_only_jwt_secret_that_is_at_least_32_characters
      INTERNAL_SERVICE_KEY: ci-only-internal-key
      INTERNAL_SERVICE_SECRET: ci_only_internal_secret_that_is_at_least_32_characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
      - run: npm run build
      - run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - working-directory: apps/android
        run: ./gradlew test lintRelease assembleRelease
